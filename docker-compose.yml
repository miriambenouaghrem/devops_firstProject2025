services:
  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: studentdb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    image: siwar97/devops:latest
    container_name: student-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/studentdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "secret"
      SERVER_PORT: "8089"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "mappings,health"
      MANAGEMENT_SERVER_PORT: "8089"
    ports:
      - "9090:8089"
    restart: on-failure

volumes:
  mysql-data:


